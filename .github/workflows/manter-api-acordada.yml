# Segunda camada contra a hibernação do plano gratuito do Render.
#
# A primeira é o aquecimento no front, que dispara /health assim que a página
# monta e gasta o religamento enquanto a pessoa ainda lê a tela. Ela só ajuda
# quem já chegou: o primeiro visitante do dia continuaria esperando.
#
# Aqui no GitHub Actions e não num cron job do Render porque cron job de lá é
# recurso pago. Fora do horário a API hiberna de propósito — manter acordada
# 24h gastaria a cota de horas do plano gratuito à toa.

name: Manter a API acordada

on:
  schedule:
    # A cada 10 minutos, das 8h às 23h de Brasília (UTC-3). O Render hiberna
    # após 15 minutos parado, e o agendador do GitHub atrasa com frequência —
    # 10 dá margem para um disparo perdido sem deixar o serviço cair.
    - cron: '*/10 11-23,0-2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chama /health
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "Defina a variável API_URL do repositório."
            exit 1
          fi
          # --max-time alto porque religar do zero leva dezenas de segundos, e
          # é justamente esse o caso que se quer cobrir.
          curl --fail --silent --show-error --max-time 90 \
            "${{ vars.API_URL }}/health"
