# O roteamento é do lado do cliente. Sem a reescrita para o index, um link
# direto para /meus-ingressos cairia em 404 do servidor estático — o mesmo
# motivo pelo qual `vercel.json` existe, resolvido aqui na sintaxe do nginx.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos de `assets/` levam hash no nome, então o conteúdo nunca muda
    # sob o mesmo endereço. O index fica de fora de propósito: é ele que
    # aponta para os hashes novos depois de um deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
