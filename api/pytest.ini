[pytest]
testpaths = tests

# Testes de contrato batem no TMDb de verdade e ficam fora da execução
# padrão: dependem de rede e de chave configurada. Rode com -m contract.
addopts = -q --strict-markers -m "not contract"

markers =
    contract: verifica que a resposta real do TMDb ainda tem o formato esperado

filterwarnings =
    error
    # Aviso do próprio Starlette sobre dependência interna dele; não há ação
    # do nosso lado até o httpx2 estabilizar.
    ignore:Using `httpx` with `starlette.testclient`
